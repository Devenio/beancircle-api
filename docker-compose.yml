services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beancircle
      POSTGRES_PASSWORD: beancircle
      POSTGRES_DB: beancircle
    # Host 5434 avoids conflict with a local PostgreSQL often bound to 5433 on Windows.
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:3000,http://127.0.0.1:3000'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  # One-shot: bucket + public read + CORS so browser PUT uploads work from localhost:3000
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do sleep 1; done
        mc mb local/beancircle --ignore-existing
        mc anonymous set download local/beancircle
    restart: 'no'

volumes:
  pgdata:
  miniodata:
