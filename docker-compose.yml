services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beancircle
      POSTGRES_PASSWORD: beancircle
      POSTGRES_DB: beancircle
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass changeme-redis-password
    ports:
      - '127.0.0.1:6379:6379'

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:3000,http://127.0.0.1:3000'
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:RELEASE.2024-12-18T07-45-33Z
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do sleep 1; done
        mc mb local/beancircle --ignore-existing
    restart: 'no'

volumes:
  pgdata:
  miniodata:
